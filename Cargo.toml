[package]
name = "konverrt"
version = "0.1.0"
authors = ["kryvashek@gmail.com", "acacita@yandex.ru"]
edition = "2021"
description = "A small library intended to simplify conversion of Rust Results into HTTP responses."
readme = "README.md"
repository = "https://github.com/kislo-tech/konverrt"
license = "GPL-2.0"
keywords = ["error", "http", "response", "result"]
categories = [
    "network-programming",
    "rust-patterns",
    "web-programming::http-server",
]

[features]
default = ["axum", "utoipa"]
axum = ["dep:axum"]
utoipa = ["dep:utoipa"]

[dependencies]
anyhow = "1.0"
axum = {version = "0.8", optional = true }
cubob = { version = "1.3.4", features = ["embed", "instant", "path"] }
http = "1.5.0"
paste = "1.0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
utoipa = {version = "5.4", optional = true}

[dev-dependencies]
axum-test = "21.1.0"
futures = "0.3"
