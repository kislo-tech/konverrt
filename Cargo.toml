[package]
name = "lingonberry"
version = "0.1.0"
authors = ["kryvashek@gmail.com"]
edition = "2021"
description = "A small library intended to simplify conversion of Rust Results into HTTP responses."
readme = "README.md"
repository = "https://github.com/kislo-tech/lingonberry"
license = "GPL-2.0"
keywords = ["error", "http", "response", "result"]
categories = [
    "network-programming",
    "rust-patterns",
    "web-programming::http-server",
]

[dependencies]
anyhow = "1.0"
axum = "0.8"
cubob = { version = "1.3.4", features = ["embed", "instant", "path"] }
paste = "1.0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
utoipa = "5.4"